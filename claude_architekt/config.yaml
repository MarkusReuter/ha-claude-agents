name: Claude Architekt
version: "0.1.0"
slug: claude_architekt
description: Claude-Code-Agent "Architekt" – Code und Bauthemen in den eigenen GitHub-Repos, per Remote Control aus der Claude-App
url: https://github.com/MarkusReuter/ha-claude-agents
arch:
  - amd64
startup: application
boot: auto
stdin: false
# Kein Zugang zu HA Core oder Supervisor. Lokales Netz sperrt die Firewall (EGRESS=internet).
homeassistant_api: false
hassio_api: false
auth_api: false
host_network: false
# Einrichtungs-Terminal (ttyd). Laeuft nur bei setup_terminal: true, eingehend nur vom Ingress-Proxy.
ingress: true
ingress_port: 7681
panel_icon: mdi:pencil-ruler
panel_title: Architekt
panel_admin: true
# Nur fuer die Egress-Firewall im Container (nftables). Claude Code selbst laeuft ohne Capabilities.
privileged:
  - NET_ADMIN
# Selbst geladene Werkzeuge (Flutter/Android-SDK, mehrere GB), Abhaengigkeiten und Build-Ausgaben
# der Klone nicht ins HA-Backup
backup_exclude:
  - "architekt/.werkzeuge"
  - "architekt/.werkzeuge/**"
  - "**/node_modules"
  - "**/.venv"
  - "**/__pycache__"
  - "**/.dart_tool"
  - "**/.gradle"
  - "**/build"
  - "**/dist"
options:
  firewall_mode: enforce
  setup_terminal: true
  pty: false
  github_owner: MarkusReuter
  github_token: ""
  austausch_repo: private-data
schema:
  # Kein "off": ohne Firewall waeren HA, Paperless und das LAN fuer die Shell erreichbar
  firewall_mode: list(learn|enforce)
  setup_terminal: bool
  pty: bool
  github_owner: match(^[A-Za-z0-9-]{1,39}$)
  github_token: password
  austausch_repo: match(^([A-Za-z0-9._-]{1,100})?$)
