configuration:
  firewall_mode:
    name: Firewall mode
    description: >-
      enforce = internet open, local network (HA, Paperless, router, other add-ons) and IPv6 blocked ·
      learn = block nothing, only record local-network targets (debugging only)
  setup_terminal:
    name: Setup terminal
    description: Web terminal (Web UI) for login and tests. Turn off after setup.
  github_owner:
    name: GitHub account
    description: Only repositories of this account go through the token proxy.
  github_token:
    name: GitHub token
    description: >-
      Fine-grained personal access token (all repositories; Contents, Pull requests, Issues read/write;
      NO Workflows permission). Only the proxy reads it, never the agent.
  austausch_repo:
    name: Exchange repository
    description: >-
      Repository for exchanging files (e.g. private-data). Only here the agent may push to main and
      create releases with files. Elsewhere only claude/* branches and pull requests. Empty = none.
  pty:
    name: Pseudo terminal
    description: Run the Remote Control server inside a pseudo terminal. Only if it fails without one.
