configuration:
  firewall_mode:
    name: Firewall-Modus
    description: >-
      enforce = Internet frei, lokales Netz (HA, Paperless, Router, andere Add-ons) und IPv6 gesperrt ·
      learn = nichts blockieren, Zugriffe ins lokale Netz nur protokollieren (nur zur Fehlersuche)
  setup_terminal:
    name: Einrichtungs-Terminal
    description: >-
      Web-Terminal (Web-UI) fuer die Ersteinrichtung und Tests. Nach der Einrichtung ausschalten –
      dann zeigt die Web-UI die Login-Seite zum Erneuern des Logins (auch vom Handy).
  github_owner:
    name: GitHub-Konto
    description: >-
      Nur Repos dieses Kontos laufen ueber den Proxy mit Token (z. B. MarkusReuter).
  github_token:
    name: GitHub-Token
    description: >-
      Fine-grained Personal Access Token (alle Repos des Kontos; Contents, Pull requests, Issues
      lesen/schreiben; KEIN Workflows-Recht). Nur der Proxy liest ihn, nie der Agent.
  austausch_repo:
    name: Austausch-Repo
    description: >-
      Repo fuer den Datenaustausch (z. B. private-data). Nur hier darf der Agent direkt auf main
      pushen und Releases mit Dateien anlegen. In allen anderen Repos nur Branches claude/* und
      Pull Requests. Leer = kein Austausch-Repo.
  gemini_api_key:
    name: Gemini-API-Key
    description: >-
      Key aus Google AI Studio fuer Bilder/Renderings (Innenarchitektur). Am besten mit
      Abrechnung (bezahlte Stufe): Bei der kostenlosen Stufe darf Google Eingaben zur Verbesserung
      nutzen. Nur der Proxy liest ihn, nie der Agent. Leer = Gemini aus.
  gemini_modell:
    name: Gemini-Bildmodell
    description: Standardmodell fuer gemini-bild, z. B. gemini-2.5-flash-image.
  gemini_max_pro_tag:
    name: Gemini-Aufrufe pro Tag
    description: >-
      Obergrenze fuer Gemini-Aufrufe je Tag (Kostenschutz). 0 = gesperrt. Zaehler beginnt beim
      Neustart des Add-ons von vorn.
  pty:
    name: Pseudo-Terminal
    description: >-
      Remote-Control-Server in einem Pseudo-Terminal starten. Nur einschalten, falls er
      ohne Terminal nicht laeuft.
