configuration:
  firewall_mode:
    name: Firewall mode
    description: >-
      off = no egress filter · learn = block nothing, only record ·
      enforce = only Anthropic and Paperless reachable
  setup_terminal:
    name: Setup terminal
    description: Web terminal (Web UI) for login and tests. Turn off after setup.
  paperless_url:
    name: Paperless URL
    description: Internal address of Paperless-ngx (without /api). Also the only internal firewall target.
  paperless_token:
    name: Paperless token
    description: API token of the dedicated Paperless user "archivar" (no delete permission).
  paperless_link_url:
    name: Paperless address for links
    description: Address you open Paperless with in the browser. Used only for clickable links, never requested. Empty = no links.
  paperless_write:
    name: Write access to Paperless
    description: Allow replacing content and setting OCR tags (each needs approval). Off = read only. Takes effect after restart.
  tag_ocr_neu:
    name: Tag "re-OCR"
    description: Tag for documents the Archivar should transcribe again.
  tag_ocr_claude:
    name: Tag "OCR by Claude"
    description: Tag for documents whose content the Archivar replaced.
  pty:
    name: Pseudo terminal
    description: Run the Remote Control server inside a pseudo terminal. Only if it fails without one.
