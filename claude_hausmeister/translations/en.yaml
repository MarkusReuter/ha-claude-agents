configuration:
  firewall_mode:
    name: Firewall mode
    description: >-
      off = no egress filter · learn = block nothing, only record ·
      enforce = only Anthropic and Home Assistant reachable
  setup_terminal:
    name: Setup terminal
    description: Web terminal (Web UI) for login and tests. Turn off after setup.
  ha_write:
    name: Write access to Home Assistant
    description: Allow changes (each needs approval). Off = read only. Takes effect after restart.
  pty:
    name: Pseudo terminal
    description: Run the Remote Control server inside a pseudo terminal. Only if it fails without one.
  ablage_github_repo:
    name: Upload repo (GitHub)
    description: Private repo as owner/name for release-asset uploads (no git history, deleted after 30 days). Empty = no uploads. Public repos are refused.
  ablage_github_token:
    name: Upload token (GitHub)
    description: Fine-grained token for this repo only, "Contents read and write", with expiry. Every upload needs approval.
