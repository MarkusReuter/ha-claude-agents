configuration:
  firewall_mode:
    name: Firewall-Modus
    description: >-
      off = kein Egress-Filter · learn = nichts blockieren, nur protokollieren ·
      enforce = nur Anthropic und Home Assistant erreichbar
  setup_terminal:
    name: Einrichtungs-Terminal
    description: >-
      Web-Terminal (Web-UI) fuer Login und Tests. Nach der Einrichtung ausschalten.
  ha_write:
    name: Schreibrecht in Home Assistant
    description: >-
      Erlaubt dem Hausmeister Aenderungen (Dashboards, Automationen, Helfer, Schalten) –
      jede einzeln mit Freigabe. Aus = nur lesen. Wirkt nach Neustart des Add-ons.
  ablage_github_repo:
    name: Ablage-Repo (GitHub)
    description: >-
      Privates Repo als besitzer/name, in das der Hausmeister Pakete als Release-Anhang hochlaedt
      (ohne Git-Historie, Loeschung nach 30 Tagen). Leer = kein Hochladen. Oeffentliche Repos
      werden abgelehnt.
  ablage_github_token:
    name: Ablage-Token (GitHub)
    description: >-
      Fine-grained Token nur fuer dieses eine Repo, Recht „Contents: Read and write“, mit
      Ablaufdatum. Jedes Hochladen braucht deine Freigabe.
  pty:
    name: Pseudo-Terminal
    description: >-
      Remote-Control-Server in einem Pseudo-Terminal starten. Nur einschalten, falls er
      ohne Terminal nicht laeuft.
